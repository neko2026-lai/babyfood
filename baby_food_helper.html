<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的家庭食谱与排餐助手</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --primary-light: #E8F5E9;
      --secondary-color: #FF9800;
      --text-color: #333;
      --bg-color: #F4F6F8;
      --card-bg: #FFFFFF;
      --border-radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 70px;
    }

    /* 顶部导航 */
    header {
      background-color: var(--card-bg);
      padding: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* 底部 Tab */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      border-top: 1px solid #EEE;
      z-index: 100;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #888;
      cursor: pointer;
    }

    .tab-item.active {
      color: var(--primary-color);
      font-weight: bold;
    }

    .tab-icon {
      font-size: 20px;
      margin-bottom: 2px;
    }

    /* 页面切换 */
    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* 食谱列表与卡片 */
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .recipe-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .recipe-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      background-color: #EEE;
    }

    .recipe-info {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .recipe-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .recipe-tag {
      display: inline-block;
      padding: 2px 6px;
      background: var(--primary-light);
      color: var(--primary-color);
      font-size: 11px;
      border-radius: 4px;
      align-self: flex-start;
      margin-bottom: 8px;
    }

    .recipe-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #EEE;
    }

    .action-btn {
      background: none;
      border: none;
      font-size: 13px;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .action-btn.edit {
      color: #2196F3;
    }

    .action-btn.delete {
      color: #F44336;
    }

    /* 搜索与筛选 */
    .search-box {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #DDD;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
      margin-bottom: 12px;
      background-color: #FFF;
    }

    .category-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 16px;
      background: #EAEAEA;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--primary-color);
      color: #FFF;
    }

    /* 悬浮按钮 */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 80px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--primary-color);
      color: #FFF;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(76,175,80,0.4);
      cursor: pointer;
      z-index: 90;
    }

    /* 弹窗样式 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #FFF;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      border-radius: var(--border-radius);
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: #999;
      cursor: pointer;
    }

    /* 表单控件 */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #555;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #DDD;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 70px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: var(--primary-color);
      color: #FFF;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    /* 排餐表样式 */
    .plan-day {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .plan-day-title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    .meal-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #EEE;
    }

    .meal-slot:last-child {
      border-bottom: none;
    }

    .meal-name {
      font-size: 13px;
      color: #666;
      width: 50px;
    }

    .meal-content {
      flex: 1;
      font-size: 14px;
      margin: 0 10px;
    }

    .meal-add-btn {
      font-size: 12px;
      color: var(--primary-color);
      background: var(--primary-light);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      border: none;
    }

    /* 图片预览区 */
    .img-preview {
      width: 100%;
      height: 140px;
      border: 1px dashed #DDD;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 13px;
      margin-top: 6px;
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body>

  <header id="header-title">食谱大全</header>

  <div class="container">
    <!-- Tab 1: 食谱库页面 -->
    <div id="page-recipes" class="page active">
      <input type="text" id="search-input" class="search-box" placeholder="搜索食谱名称或食材..." oninput="renderRecipes()">
      
      <div class="category-filter" id="category-filter">
        <div class="filter-chip active" onclick="filterCategory('全部')">全部</div>
        <div class="filter-chip" onclick="filterCategory('主食')">主食</div>
        <div class="filter-chip" onclick="filterCategory('炒菜')">炒菜</div>
        <div class="filter-chip" onclick="filterCategory('汤羹')">汤羹</div>
        <div class="filter-chip" onclick="filterCategory('烘焙/点心')">烘焙/点心</div>
      </div>

      <div class="recipe-grid" id="recipe-list">
        <!-- 动态生成食谱卡片 -->
      </div>
    </div>

    <!-- Tab 2: 周排餐计划页面 -->
    <div id="page-plan" class="page">
      <div id="plan-list">
        <!-- 动态生成一周排餐 -->
      </div>
    </div>
  </div>

  <!-- 悬浮添加按钮 -->
  <div class="fab" id="fab-add" onclick="openRecipeModal()">+</div>

  <!-- 底部导航 -->
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('recipes')">
      <span class="tab-icon">📖</span>
      <span>食谱库</span>
    </div>
    <div class="tab-item" onclick="switchTab('plan')">
      <span class="tab-icon">📅</span>
      <span>周排餐</span>
    </div>
  </div>

  <!-- 新增/编辑 食谱弹窗 -->
  <div class="modal" id="recipe-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-form-title">添加新食谱</div>
        <button class="close-btn" onclick="closeRecipeModal()">×</button>
      </div>
      <form id="recipe-form" onsubmit="saveRecipe(event)">
        <!-- 隐式保存编辑中的 Recipe ID -->
        <input type="hidden" id="recipe-id">

        <div class="form-group">
          <label>食谱名称 *</label>
          <input type="text" id="form-name" class="form-control" required placeholder="例如：西红柿炒鸡蛋">
        </div>

        <div class="form-group">
          <label>分类 *</label>
          <select id="form-category" class="form-control">
            <option value="主食">主食</option>
            <option value="炒菜">炒菜</option>
            <option value="汤羹">汤羹</option>
            <option value="烘焙/点心">烘焙/点心</option>
          </select>
        </div>

        <div class="form-group">
          <label>所需食材</label>
          <input type="text" id="form-ingredients" class="form-control" placeholder="用逗号隔开，如：鸡蛋2个，西红柿1个">
        </div>

        <div class="form-group">
          <label>制作步骤</label>
          <textarea id="form-steps" class="form-control" placeholder="1. 鸡蛋打散...&#10;2. 西红柿切块..."></textarea>
        </div>

        <div class="form-group">
          <label>食物图片</label>
          <input type="file" id="form-img-input" class="form-control" accept="image/*" onchange="handleImageUpload(event)">
          <div id="img-preview" class="img-preview">暂无图片预览</div>
        </div>

        <button type="submit" class="btn">保存食谱</button>
      </form>
    </div>
  </div>

  <!-- 查看食谱详情弹窗 -->
  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="detail-name">食谱详情</div>
        <button class="close-btn" onclick="closeDetailModal()">×</button>
      </div>
      <div id="detail-body">
        <!-- 详情内容动态填充 -->
      </div>
    </div>
  </div>

  <!-- 排餐选择器弹窗 -->
  <div class="modal" id="select-meal-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">选择要安排的食谱</div>
        <button class="close-btn" onclick="closeSelectMealModal()">×</button>
      </div>
      <div id="meal-options-list" style="max-height: 300px; overflow-y: auto;">
        <!-- 动态生成可选食谱 -->
      </div>
    </div>
  </div>

  <script>
    // 默认初始数据（无适合月龄）
    const initialRecipes = [
      {
        id: '1',
        name: '西红柿炒鸡蛋',
        category: '炒菜',
        ingredients: '鸡蛋 2个, 西红柿 1个, 盐 适量, 糖 少许',
        steps: '1. 鸡蛋打散炒熟盛出。\n2. 西红柿切块炒出汁。\n3. 倒回鸡蛋加盐调味炒匀。',
        image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&auto=format&fit=crop'
      },
      {
        id: '2',
        name: '皮蛋瘦肉粥',
        category: '主食',
        ingredients: '大米 100g, 瘦肉 50g, 皮蛋 1个, 葱花 少许',
        steps: '1. 大米淘洗干净熬煮成粥。\n2. 瘦肉切丝腌制，皮蛋切块。\n3. 粥熟后放入瘦肉和皮蛋煮5分钟，出锅撒葱花。',
        image: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=400&auto=format&fit=crop'
      }
    ];

    const weekDays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const mealTypes = ['早餐', '午餐', '晚餐'];

    // 全局状态
    let recipes = [];
    let weeklyPlan = {};
    let currentCategory = '全部';
    let currentImageBase64 = '';
    let currentSelectingSlot = { day: null, meal: null };

    // 初始化
    window.onload = function() {
      // 1. 读取本地食谱
      const localRecipes = localStorage.getItem('my_recipes_v2');
      if (localRecipes) {
        recipes = JSON.parse(localRecipes);
      } else {
        recipes = initialRecipes;
        saveRecipesToStorage();
      }

      // 2. 读取排餐表
      const localPlan = localStorage.getItem('my_meal_plan_v2');
      if (localPlan) {
        weeklyPlan = JSON.parse(localPlan);
      } else {
        // 初始化空排餐
        weekDays.forEach(day => {
          weeklyPlan[day] = { '早餐': '', '午餐': '', '晚餐': '' };
        });
        savePlanToStorage();
      }

      renderRecipes();
      renderWeeklyPlan();
    };

    function saveRecipesToStorage() {
      localStorage.setItem('my_recipes_v2', JSON.stringify(recipes));
    }

    function savePlanToStorage() {
      localStorage.setItem('my_meal_plan_v2', JSON.stringify(weeklyPlan));
    }

    // 切换 Tab
    function switchTab(tab) {
      document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));

      if (tab === 'recipes') {
        document.querySelectorAll('.tab-item')[0].classList.add('active');
        document.getElementById('page-recipes').classList.add('active');
        document.getElementById('header-title').innerText = '食谱大全';
        document.getElementById('fab-add').style.display = 'flex';
      } else if (tab === 'plan') {
        document.querySelectorAll('.tab-item')[1].classList.add('active');
        document.getElementById('page-plan').classList.add('active');
        document.getElementById('header-title').innerText = '本周排餐计划';
        document.getElementById('fab-add').style.display = 'none';
      }
    }

    // 分类筛选
    function filterCategory(cat) {
      currentCategory = cat;
      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => {
        chip.classList.toggle('active', chip.innerText === cat);
      });
      renderRecipes();
    }

    // 渲染食谱列表
    function renderRecipes() {
      const listEl = document.getElementById('recipe-list');
      const searchText = document.getElementById('search-input').value.toLowerCase();

      const filtered = recipes.filter(r => {
        const matchesCat = currentCategory === '全部' || r.category === currentCategory;
        const matchesSearch = r.name.toLowerCase().includes(searchText) || 
                              (r.ingredients && r.ingredients.toLowerCase().includes(searchText));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #999; padding: 40px 0;">暂无相关食谱</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(r => `
        <div class="recipe-card">
          <img src="${r.image || 'https://via.placeholder.com/150?text=Food'}" class="recipe-img" onclick="openDetailModal('${r.id}')" alt="${r.name}">
          <div class="recipe-info">
            <div>
              <div class="recipe-title" onclick="openDetailModal('${r.id}')">${r.name}</div>
              <span class="recipe-tag">${r.category}</span>
            </div>
            <div class="recipe-actions">
              <button class="action-btn edit" onclick="openRecipeModal('${r.id}')">✏️ 编辑</button>
              <button class="action-btn delete" onclick="deleteRecipe('${r.id}')">🗑️ 删除</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 图片上传处理
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        currentImageBase64 = event.target.result;
        const previewEl = document.getElementById('img-preview');
        previewEl.style.backgroundImage = `url(${currentImageBase64})`;
        previewEl.innerText = '';
      };
      reader.readAsDataURL(file);
    }

    // 打开“新增/编辑”弹窗
    function openRecipeModal(id = null) {
      const modal = document.getElementById('recipe-modal');
      const formTitle = document.getElementById('modal-form-title');
      const form = document.getElementById('recipe-form');
      const previewEl = document.getElementById('img-preview');

      form.reset();
      currentImageBase64 = '';

      if (id) {
        // 编辑模式
        const recipe = recipes.find(r => r.id === id);
        if (!recipe) return;

        formTitle.innerText = '编辑食谱';
        document.getElementById('recipe-id').value = recipe.id;
        document.getElementById('form-name').value = recipe.name;
        document.getElementById('form-category').value = recipe.category;
        document.getElementById('form-ingredients').value = recipe.ingredients || '';
        document.getElementById('form-steps').value = recipe.steps || '';
        
        if (recipe.image) {
          currentImageBase64 = recipe.image;
          previewEl.style.backgroundImage = `url(${recipe.image})`;
          previewEl.innerText = '';
        } else {
          previewEl.style.backgroundImage = 'none';
          previewEl.innerText = '暂无图片预览';
        }
      } else {
        // 新增模式
        formTitle.innerText = '添加新食谱';
        document.getElementById('recipe-id').value = '';
        previewEl.style.backgroundImage = 'none';
        previewEl.innerText = '暂无图片预览';
      }

      modal.classList.add('active');
    }

    function closeRecipeModal() {
      document.getElementById('recipe-modal').classList.remove('active');
    }

    // 保存食谱（新增或更新）
    function saveRecipe(e) {
      e.preventDefault();

      const editId = document.getElementById('recipe-id').value;
      const name = document.getElementById('form-name').value.trim();
      const category = document.getElementById('form-category').value;
      const ingredients = document.getElementById('form-ingredients').value.trim();
      const steps = document.getElementById('form-steps').value.trim();

      if (editId) {
        // 更新食谱
        const index = recipes.findIndex(r => r.id === editId);
        if (index !== -1) {
          recipes[index] = {
            ...recipes[index],
            name,
            category,
            ingredients,
            steps,
            image: currentImageBase64 || recipes[index].image || ''
          };
        }
      } else {
        // 新增食谱
        const newRecipe = {
          id: Date.now().toString(),
          name,
          category,
          ingredients,
          steps,
          image: currentImageBase64 || 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=400&auto=format&fit=crop'
        };
        recipes.unshift(newRecipe);
      }

      saveRecipesToStorage();
      renderRecipes();
      closeRecipeModal();
    }

    // 删除食谱
    function deleteRecipe(id) {
      if (confirm('确定要删除这个食谱吗？')) {
        recipes = recipes.filter(r => r.id !== id);
        saveRecipesToStorage();
        renderRecipes();
      }
    }

    // 查看详情弹窗
    function openDetailModal(id) {
      const recipe = recipes.find(r => r.id === id);
      if (!recipe) return;

      document.getElementById('detail-name').innerText = recipe.name;
      const bodyEl = document.getElementById('detail-body');

      bodyEl.innerHTML = `
        ${recipe.image ? `<img src="${recipe.image}" style="width:100%; height:180px; object-fit:cover; border-radius:8px; margin-bottom:12px;">` : ''}
        <div style="margin-bottom:10px;">
          <span class="recipe-tag">${recipe.category}</span>
        </div>
        <div style="margin-bottom:12px;">
          <strong style="font-size:14px; color:#333;">【食材清单】</strong>
          <p style="font-size:14px; color:#666; margin-top:4px; white-space:pre-line;">${recipe.ingredients || '未填写'}</p>
        </div>
        <div>
          <strong style="font-size:14px; color:#333;">【制作步骤】</strong>
          <p style="font-size:14px; color:#666; margin-top:4px; white-space:pre-line;">${recipe.steps || '未填写'}</p>
        </div>
      `;

      document.getElementById('detail-modal').classList.add('active');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.remove('active');
    }

    // 渲染周排餐
    function renderWeeklyPlan() {
      const planEl = document.getElementById('plan-list');

      planEl.innerHTML = weekDays.map(day => `
        <div class="plan-day">
          <div class="plan-day-title">${day}</div>
          ${mealTypes.map(meal => {
            const currentRecipeName = weeklyPlan[day][meal] || '未排餐';
            return `
              <div class="meal-slot">
                <span class="meal-name">${meal}</span>
                <span class="meal-content" style="color: ${weeklyPlan[day][meal] ? '#333' : '#AAA'};">
                  ${currentRecipeName}
                </span>
                <button class="meal-add-btn" onclick="openSelectMealModal('${day}', '${meal}')">
                  ${weeklyPlan[day][meal] ? '更换' : '选择'}
                </button>
              </div>
            `;
          }).join('')}
        </div>
      `).join('');
    }

    // 选择排餐食谱
    function openSelectMealModal(day, meal) {
      currentSelectingSlot = { day, meal };
      const listEl = document.getElementById('meal-options-list');

      let optionsHTML = `
        <div style="padding: 10px; border-bottom: 1px solid #EEE; color: #888; cursor: pointer;" onclick="selectMealForSlot('')">
          🚫 清空该餐
        </div>
      `;

      optionsHTML += recipes.map(r => `
        <div style="padding: 12px 10px; border-bottom: 1px solid #EEE; display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="selectMealForSlot('${r.name}')">
          <span style="font-size:14px; font-weight:bold;">${r.name}</span>
          <span class="recipe-tag">${r.category}</span>
        </div>
      `).join('');

      listEl.innerHTML = optionsHTML;
      document.getElementById('select-meal-modal').classList.add('active');
    }

    function closeSelectMealModal() {
      document.getElementById('select-meal-modal').classList.remove('active');
    }

    function selectMealForSlot(recipeName) {
      const { day, meal } = currentSelectingSlot;
      if (day && meal) {
        weeklyPlan[day][meal] = recipeName;
        savePlanToStorage();
        renderWeeklyPlan();
      }
      closeSelectMealModal();
    }
  </script>
</body>
</html>
